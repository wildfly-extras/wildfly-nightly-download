name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.0.0"
        required: true
      next-version:
        description: "Next development version, e.g. 2.0.1 (defaults to an auto patch bump)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the requested versions
        env:
          VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ inputs.next-version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be MAJOR.MINOR.PATCH with no leading v, e.g. 2.0.0 (got '${VERSION}')"
            exit 1
          fi
          if [ -n "$NEXT_VERSION" ] && ! printf '%s' "$NEXT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::next-version must be MAJOR.MINOR.PATCH with no leading v, e.g. 2.0.1 (got '${NEXT_VERSION}')"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Verify dist/ is up to date
        run: npm run verify:dist

  tag:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release tag and move the major tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          major="v${VERSION%%.*}"

          git tag "v${VERSION}"
          git tag -f "$major"
          git push origin "v${VERSION}"
          git push -f origin "$major"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v${VERSION}" --generate-notes

  bump-version:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute next development version
        id: next
        env:
          VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ inputs.next-version }}
        run: |
          next="$NEXT_VERSION"
          if [ -z "$next" ]; then
            IFS='.' read -r major minor patch <<< "$VERSION"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
      - name: Bump package.json and package-lock.json
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: npm version --no-git-tag-version "$NEXT_VERSION"
      - name: Open version bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          branch="chore/bump-version-to-${NEXT_VERSION}"
          git config user.name "$ACTOR"
          git config user.email "${ACTOR}@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -s -am "Bump version to ${NEXT_VERSION}"
          git push origin "$branch"
          gh pr create --title "Bump version to ${NEXT_VERSION}" \
            --body "Prepares for the next development iteration after releasing v${VERSION}." \
            --base main --head "$branch"
